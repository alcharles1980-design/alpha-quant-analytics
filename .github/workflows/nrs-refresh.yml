name: Narrow Range Screener Refresh

on:
  # SCHEDULE MOVED TO SUPABASE pg_cron (Oct 29 2026). GitHub's own `schedule:` trigger ran these
  # jobs 3-6.5 HOURS late, so heavy writes from several of them landed on top of each other and on
  # the pre-market scanner. pg_cron job `nrs-refresh-dispatch` now dispatches this workflow at 22:40 UTC Mon-Fri (17:40 EST / 18:40 EDT) via
  # ops.dispatch_workflow(), and ops.workflow_dispatch_check() alerts if GitHub does not accept it.
  # Do NOT add a `schedule:` back here, or the job runs twice. See CLAUDE.md §8y.
  workflow_dispatch:
    inputs:
      timeframe:
        description: 'H, D, or both'
        required: false
        default: 'both'
      lookback_days:
        description: 'Days of bars to re-fetch (small overlap re-upserts safely)'
        required: false
        default: '5'

concurrency:
  group: nrs-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Measured: daily ~1 min, hourly ~2.5 min. 30 is generous headroom for a slow Alpaca day
    # without letting a hung run burn the Actions allowance.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Refresh daily timeframe
        if: ${{ inputs.timeframe == 'D' || inputs.timeframe == 'both' || inputs.timeframe == '' }}
        run: node nrs-refresh.js --timeframe D
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NRS_LOOKBACK_DAYS: ${{ inputs.lookback_days || '5' }}

      - name: Refresh hourly timeframe
        if: ${{ inputs.timeframe == 'H' || inputs.timeframe == 'both' || inputs.timeframe == '' }}
        run: node nrs-refresh.js --timeframe H
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NRS_LOOKBACK_DAYS: ${{ inputs.lookback_days || '5' }}
