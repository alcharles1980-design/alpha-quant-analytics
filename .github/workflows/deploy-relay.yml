name: Deploy Trade Relay

# Path-filtered rather than added to deploy.yml, matching deploy-predict.yml: the relay holds a
# live upstream websocket, so it should redeploy only when its own code changes — not on every
# docs commit. A redeploy drops the connection and restarts the count buffer.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trade-relay-worker.js'
      - 'wrangler-relay.toml'

jobs:
  deploy-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy Trade Relay Worker
        run: npx wrangler@latest deploy --config wrangler-relay.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker secrets are pushed from GitHub secrets so there is no manual step and nothing
      # sensitive is committed. Deliberately NOT read from Supabase app_config at runtime: the
      # relay must be able to start counting without the database being reachable, and
      # app_config is browser-readable through get_app_client_keys.
      - name: Set Alpaca credentials as Worker secrets
        run: |
          echo "${{ secrets.ALPACA_KEY }}"    | npx wrangler@latest secret put ALPACA_KEY    --config wrangler-relay.toml
          echo "${{ secrets.ALPACA_SECRET }}" | npx wrangler@latest secret put ALPACA_SECRET --config wrangler-relay.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test — relay answers and reports its health
        run: |
          sleep 10
          for feed in sip boats; do
            echo "--- $feed ---"
            curl -s "https://trade-relay.alcharles1980.workers.dev/health?feed=$feed" || true
            echo
          done
