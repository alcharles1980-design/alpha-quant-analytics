name: Nightly Pipeline

on:
  # SCHEDULE MOVED TO SUPABASE pg_cron (Oct 29 2026). GitHub's own `schedule:` trigger ran these
  # jobs 3-6.5 HOURS late, so heavy writes from several of them landed on top of each other and on
  # the pre-market scanner. pg_cron job `pipeline-nightly-onon` now dispatches this workflow at 15:25 UTC Mon-Fri via
  # ops.dispatch_workflow(), and ops.workflow_dispatch_check() alerts if GitHub does not accept it.
  # Do NOT add a `schedule:` back here, or the job runs twice. See CLAUDE.md §8y.
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers'
        required: true
        default: 'ONON'

concurrency:
  group: pipeline-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
      - name: Run nightly
        run: node pipeline.js --nightly --tickers ${{ inputs.tickers || 'ONON' }}
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
